name: Smoke Test

# Builds the HammerDB image and runs a minimal TPC-C benchmark end to end
# against a real SQL Server. GitHub's Linux runners are x86_64, so this runs
# natively rather than under the emulation used on Apple Silicon.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tprocc:
    name: TPC-C build, load, parse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cp hammerdb.env.example hammerdb.env

      - name: Build HammerDB image
        run: docker compose build

      - name: Verify HammerDB version and layout
        run: |
          docker run --rm --entrypoint /bin/bash hammerdb-hammerdb:latest -c '
            set -e
            /opt/HammerDB-6.0/hammerdbcli -h | head -1
            test -f /opt/HammerDB-6.0/modules/xtprof-1.0.tm
            command -v mpstat >/dev/null
            test -x /opt/HammerDB-6.0/agent/agent
          '

      - name: Start SQL Server
        run: |
          docker run \
            --env 'ACCEPT_EULA=Y' \
            --env 'MSSQL_SA_PASSWORD=S0methingS@Str0ng!' \
            --name sql2025 \
            --publish 4001:1433 \
            --detach mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 40); do
            if docker exec sql2025 /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P 'S0methingS@Str0ng!' -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server ready after $i attempts"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become ready"
          docker logs sql2025 | tail -50
          exit 1

      - name: Build schema
        run: |
          RUN_MODE=build BENCHMARK=tprocc docker compose up --abort-on-container-exit 2>&1 | tee build.log
          grep -q "TPROC-C SCHEMA BUILD COMPLETE" build.log
          grep -q "FINISHED SUCCESS" build.log

      - name: Load test
        run: |
          RUN_MODE=load BENCHMARK=tprocc docker compose up --abort-on-container-exit 2>&1 | tee load.log
          grep -q "TEST RESULT : System achieved" load.log
          grep -q "TPROC-C LOAD TEST COMPLETE" load.log
          # A virtual user can report FINISHED FAILED after printing a plausible
          # result, which is how a stale job repository shows up. Treat as fatal.
          if grep -q "FINISHED FAILED" load.log; then
            echo "::error::A virtual user reported FINISHED FAILED"
            exit 1
          fi

      - name: Parse results
        run: |
          docker compose run --rm --no-TTY -e RUN_MODE=parse -e BENCHMARK=tprocc hammerdb 2>&1 | tee parse.log
          grep -q "HAMMERDB RESULT" parse.log
          grep -q "JSON REPORT:" parse.log
          # HammerDB's own report, which needs the 6.0 compat shim to work
          grep -q "NATIVE REPORT:" parse.log
          if grep -q "WARNING:" parse.log; then
            echo "::error::Parse phase emitted warnings"
            grep "WARNING:" parse.log
            exit 1
          fi

      - name: Verify reports and charts
        run: |
          shopt -s nullglob
          reports=(output/tprocc_*.json)
          native=(output/hdb_*.json)
          charts=(output/tprocc_*_*.html)
          if [ ${#reports[@]} -eq 0 ]; then echo "no JSON report written"; exit 1; fi
          if [ ${#native[@]} -eq 0 ]; then echo "no native report written"; exit 1; fi
          # The broken 6.0 jobs save leaves a zero byte file, so check size
          if [ ! -s "${native[0]}" ]; then echo "native report is empty"; exit 1; fi
          if [ ${#charts[@]} -ne 3 ]; then echo "expected 3 charts, got ${#charts[@]}"; exit 1; fi
          python3 -c "
          import json, sys
          d = json.load(open('${reports[0]}'))
          missing = [k for k in ('jobid','result','transaction_count','timing','system') if k not in d]
          if missing:
              sys.exit(f'JSON report missing keys: {missing}')
          if not any('TEST RESULT' in str(x) for x in d['result']):
              sys.exit('JSON report has no TEST RESULT line')
          print('JSON report OK:', d['jobid'])
          "

      - name: Profile comparison
        run: |
          # Two tagged runs, then diff them. Reuses the schema already built.
          for p in 1 2; do
            docker compose run --rm --no-TTY \
              -e RUN_MODE=load -e BENCHMARK=tprocc -e PROFILE_ID=$p hammerdb > profile-$p.log 2>&1
            grep -q "TEST RESULT : System achieved" profile-$p.log
          done
          docker compose run --rm --no-TTY \
            -e RUN_MODE=compare -e BENCHMARK=tprocc \
            -e BASE_PROFILE_ID=1 -e COMP_PROFILE_ID=2 hammerdb 2>&1 | tee compare.log
          grep -q "Profiles compared" compare.log
          grep -q "PROFILE COMPARISON COMPLETE" compare.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: |
            output/tprocc_*.json
            output/hdb_*.json
            output/tprocc_*.html
            *.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          docker compose down --remove-orphans || true
          docker rm -f sql2025 || true
